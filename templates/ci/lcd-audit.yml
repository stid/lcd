# LCD cross-path audit gate — generated by /lcd:onboard (CI option).
#
# Enforces the Deep-lane audit on PRs for EVERY contributor and agent, not just
# well-behaved Claude sessions: any PR touching a work-item with a spec + plan must
# have every (AC × surface) pair backed by an existing handler and a test carrying
# the literal `AC-N (SURFACE)`.
#
# The scripts are VENDORED at <ARTIFACT_ROOT>/ci/ (CI can't assume the plugin is
# installed). Re-run /lcd:onboard to refresh them after a plugin update.

name: LCD audit gate

on:
  pull_request:
    paths:
      - "<ARTIFACT_ROOT>/work/**"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit changed work-items
        run: |
          set -euo pipefail
          git fetch -q origin "${{ github.base_ref }}"
          slugs="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD \
            | sed -n 's|^<ARTIFACT_ROOT>/work/\([^/]*\)/.*|\1|p' | sort -u)"
          [ -n "$slugs" ] || { echo "no work-items touched"; exit 0; }
          rc=0
          # Newline-safe: an unquoted `for` would word-split a slug containing a
          # space into fragments that all skip as "not Deep-lane" — silent bypass.
          while IFS= read -r slug; do
            [ -n "$slug" ] || continue
            dir="<ARTIFACT_ROOT>/work/$slug"
            # Only Deep-lane items (spec + plan) carry the cross-path contract.
            if [ ! -f "$dir/spec.md" ] || [ ! -f "$dir/plan.md" ]; then
              echo "::notice::$slug: no spec.md + plan.md — not a Deep-lane item, skipping"
              continue
            fi
            echo "## auditing $slug"
            if ! LCD_SPECS_DIR="<ARTIFACT_ROOT>/work" bash "<ARTIFACT_ROOT>/ci/audit-crosspath.sh" "$slug"; then
              echo "::error::LCD audit BLOCKED for work-item '$slug' — see table above"
              rc=1
            fi
          done <<< "$slugs"
          exit $rc
